# Nginx 配置：托管前端 SPA + 反代 /api /v1 到 backend:3001
# 注意：docker-compose 中 backend 服务名为 "backend"

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源长期缓存（带 hash 的文件）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA 路由回退：所有非 API、非静态资源请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 API（保留完整 /api/ 路径，后端路由带 /api 前缀）
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # WebSocket 支持（如后续需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 反代 OpenAI 兼容代理端点（保留完整 /v1/ 路径）
    location /v1/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 流式响应可能较长
        proxy_send_timeout 300s;
        proxy_buffering off;       # 关闭缓冲，支持 SSE/流式
        proxy_cache off;
    }

    # 健康检查端点（不反代，直接由 nginx 响应）
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}