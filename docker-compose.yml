# 灵犀模型聚合 - Docker Compose
# ------------------------------------------------------------------
# 两种使用方式：
#
# 1) 拉取已发布镜像（推荐，快速部署）
#    docker compose pull
#    docker compose up -d
#
# 2) 本地构建（无镜像或想改代码时）
#    docker compose up -d --build
#
# 镜像地址：ghcr.io/xcbgm/model-api-aggregator/{backend,frontend}:latest
# 首次发布镜像请执行：./deploy.sh push

name: model-api-aggregator

services:
  backend:
    image: ghcr.io/xcbgm/model-api-aggregator/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lingxi-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-lingxi-super-secret-change-in-production}
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => { if (r.statusCode !== 200) process.exit(1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lingxi-net

  frontend:
    image: ghcr.io/xcbgm/model-api-aggregator/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lingxi-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - BACKEND_URL=http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lingxi-net

networks:
  lingxi-net:
    driver: bridge
